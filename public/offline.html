<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f1">
  <title>Kokan POS · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f5f1;color:#183a2c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:440px;padding:40px;border:1px solid #e5e8de;border-radius:24px;background:white;text-align:center;box-shadow:0 20px 60px #183a2c12}.mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 20px;border-radius:17px;background:#174f3b;color:#fff;font-size:27px;font-weight:800}.mark span{color:#efbf69}.leaf{font-size:24px}.card h1{margin:10px 0;font-size:27px;letter-spacing:-.7px}.card p{margin:0;color:#728078;line-height:1.65}.pill{display:inline-flex;gap:8px;align-items:center;margin-top:24px;padding:10px 14px;border-radius:30px;background:#edf5ef;color:#235a40;font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#e9a247}
  </style>
</head>
<body><main class="card"><div class="mark">k<span>.</span></div><div class="leaf">🌿</div><h1>You’re between connections.</h1><p>Open Kokan POS once you’re back online to load your shop. Your sales and cart are always saved on this device.</p><div class="pill"><span class="dot"></span> Local-first, always</div></main></body>
</html>
